# Max stress: 20 replicas, 10-wide concurrency, 4 waves + 10 min sustained @ ~3 RPS/replica.
suite_name: max_stress
image: stress-vllm:local
build_dockerfile: Dockerfile.vllm

model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
served_model_name: tinyllama
dtype: float16
quantization: null
vllm_extra_args: []

run_labels:
  gpu_sku: unspecified
  profile: max_stress

network_chaos:
  extra_latency_ms: [0, 60]
  connection_abort_probability: 0.02
  request_drop_probability: 0.015

containers:
  count: 20
  base_host_port: 8100
  shm_size_gb: 2
  num_gpus: null
  parallel_start: true

scenarios:
  warmup:
    requests_per_container: 2
    max_output_tokens: 128
    gap_between_requests_ms: 20
  waves:
    count: 4
    gap_seconds: 5
    concurrent_per_container: 10
    requests_per_container_per_wave: 16
    jitter_ms: [0, 500]
    prompt_token_est_range: [50, 2000]
    output_token_range: [20, 500]
    prompt_token_tiers:
      - { name: short, weight: 0.45, min: 50, max: 300 }
      - { name: medium, weight: 0.40, min: 300, max: 1000 }
      - { name: long, weight: 0.15, min: 1000, max: 2200 }
  sustained:
    enabled: true
    duration_seconds: 600
    rps_per_container: 3.0

timeouts:
  container_ready_seconds: 1800
  request_seconds: 300

prometheus_scrape_timeout_seconds: 30
gpu_sample_interval_seconds: 2
docker_events: true
output_dir: ./results/max_stress
