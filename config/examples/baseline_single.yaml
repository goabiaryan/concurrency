# Baseline: one replica, light waves — compare against max_stress via compare_runs.py
suite_name: baseline_single
image: stress-vllm:local
build_dockerfile: Dockerfile.vllm

model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
served_model_name: tinyllama
dtype: float16
quantization: null
vllm_extra_args: []

run_labels:
  gpu_sku: unspecified
  profile: baseline_single

network_chaos: null

containers:
  count: 1
  base_host_port: 8100
  shm_size_gb: 2
  num_gpus: null
  parallel_start: false

scenarios:
  warmup:
    requests_per_container: 3
    max_output_tokens: 128
    gap_between_requests_ms: 100
  waves:
    count: 2
    gap_seconds: 5
    concurrent_per_container: 1
    requests_per_container_per_wave: 4
    jitter_ms: [0, 200]
    prompt_token_est_range: [50, 800]
    output_token_range: [32, 256]
    prompt_token_tiers:
      - { name: short, weight: 0.5, min: 50, max: 300 }
      - { name: medium, weight: 0.5, min: 300, max: 800 }
  sustained:
    enabled: false
    duration_seconds: 60
    rps_per_container: 1.0

timeouts:
  container_ready_seconds: 900
  request_seconds: 180

prometheus_scrape_timeout_seconds: 30
gpu_sample_interval_seconds: 2
docker_events: true
output_dir: ./results/baseline_single
